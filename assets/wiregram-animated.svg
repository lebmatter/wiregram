<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .float, .shadow, .eye, .bulb {
      transform-box: fill-box;
      transform-origin: center;
    }
    .float  { animation: float 3.5s ease-in-out infinite; }
    .shadow { animation: shadow 3.5s ease-in-out infinite; }
    .eye    { animation: blink 5s infinite; }
    .bulb   { animation: pulse 2.5s ease-in-out infinite; }

    @keyframes float {
      0%, 100% { transform: translateY(1.5px) rotate(-1.2deg); }
      50%      { transform: translateY(-2.5px) rotate(1.2deg); }
    }
    /* shadow shrinks and fades as the bubble rises */
    @keyframes shadow {
      0%, 100% { transform: scaleX(1);    opacity: .3; }
      50%      { transform: scaleX(.78);  opacity: .16; }
    }
    /* double blink near the end of each cycle */
    @keyframes blink {
      0%, 84%, 90%, 100% { transform: scaleY(1); }
      87%, 93%           { transform: scaleY(0.08); }
      96%                { transform: scaleY(1); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.25); }
    }
    @media (prefers-reduced-motion: reduce) {
      .float, .shadow, .eye, .bulb { animation: none; }
    }
  </style>
  <rect width="120" height="120" rx="22" fill="#2b1f4a"/>
  <ellipse class="shadow" cx="60" cy="108" rx="20" ry="2.8" fill="#000" opacity=".3"/>
  <g transform="translate(0,-4)">
    <g class="float">
      <g fill="#E8FE96">
        <rect x="18" y="30" width="84" height="54" rx="16"/>
        <path d="M32 80 H56 L34 100 Q31 102 31 98 Z"/>
        <rect x="57" y="19" width="6" height="12"/>
        <circle class="bulb" cx="60" cy="18" r="5"/>
      </g>
      <g fill="#2b1f4a">
        <rect class="eye" x="35" y="47" width="16" height="20" rx="5"/>
        <rect class="eye" x="69" y="47" width="16" height="20" rx="5"/>
      </g>
    </g>
  </g>
</svg>
