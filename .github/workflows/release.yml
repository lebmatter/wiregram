name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Asset names match the download links on the website.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64; do
            ext=""
            [ "${target%/*}" = windows ] && ext=.exe
            GOOS=${target%/*} GOARCH=${target#*/} go build -buildvcs=false -trimpath \
              -ldflags "-s -w" \
              -o "dist/wiregram-${target%/*}-${target#*/}${ext}" ./cmd/wiregram
          done

      # Fixed names, so latest/download links work like the binaries'.
      - name: Package
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          export VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg
          for GOARCH in amd64 arm64; do
            export GOARCH
            # nfpm does not expand env vars in contents src, so stage a fixed path.
            cp "dist/wiregram-linux-${GOARCH}" pkg/wiregram
            nfpm package -f nfpm.yaml -p deb -t "dist/wiregram-linux-${GOARCH}.deb"
            nfpm package -f nfpm.yaml -p rpm -t "dist/wiregram-linux-${GOARCH}.rpm"
          done
          cd dist && sha256sum wiregram-* > checksums.txt

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
