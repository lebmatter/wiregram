# Linux packages built by the release workflow, which copies
# dist/wiregram-linux-$GOARCH to pkg/wiregram for each arch.
name: wiregram
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: lebmatter <mmlabeeb@gmail.com>
description: Minimal multi-backend chat client for the terminal.
homepage: https://github.com/lebmatter/wiregram
license: AGPL-3.0

contents:
  - src: pkg/wiregram
    dst: /usr/bin/wiregram
    file_info:
      mode: 0755
